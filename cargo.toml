[package]
name = "kronos"
version = "0.1.0"
edition = "2021"

[dependencies]
# Candle Framework (Hugging Face Pure-Rust Machine Learning)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"

# Fast Tokenizer & Serialization
tokenizers = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Execution & Web Runtime
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
anyhow = "1.0"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
