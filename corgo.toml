[package]
name = "kronos-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# High-performance tensor library (Pure Rust)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"

# Tokenizer & serialization
tokenizers = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async execution & error handling
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
